# Render.com Blueprint: Docker runtime (required for Playwright/Chromium).
# In Render: New -> Blueprint -> connect this repo. No API key / Stripe
# key / OpenAI key is needed.
# Free plan (chosen by the owner, 2026-11-12): $0, but the service
# sleeps after 15 minutes without traffic, cold starts are slow
# (Chromium launch can take 1-2 minutes on the small free instance),
# and the small free instance has little RAM -- a browser launch may
# occasionally fail with browser_error. Standard ($7+/mo) would be
# faster and more reliable, but is not used unless the owner asks.
services:
  - type: web
    name: chatgpt-billing-tool
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_TTL_SECONDS
        value: "1800"
