services:
  billing-tool:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - MAX_CONCURRENT_JOBS=2
      - JOB_TTL_SECONDS=1800
      # Lets /api/version report the deployed commit. Set it at deploy time:
      # GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
    volumes:
      - ./data:/app/data
    # Playwright Chromium needs shared memory; without this, pages crash.
    shm_size: 2gb
    restart: unless-stopped
